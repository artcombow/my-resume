<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio & Resume</title>

  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- AOS Animation Library CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- Custom CSS แยกไฟล์ -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= Navbar เมนูด้านบน ================= -->
  <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#hero">
        <span class="text-primary">&lt;</span>MyResume<span class="text-primary">/&gt;</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#hero">หน้าแรก</a></li>
          <li class="nav-item"><a class="nav-link" href="#about">เกี่ยวกับฉัน</a></li>
          <li class="nav-item"><a class="nav-link" href="#skills">ทักษะ</a></li>
          <li class="nav-item"><a class="nav-link" href="#projects">ผลงาน</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">ติดต่อ</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ================= Section 1: Hero Section ================= -->
  <section id="hero" class="hero-section d-flex align-items-center">
    <div class="container">
      <div class="row align-items-center g-5">
        <div class="col-lg-7" data-aos="fade-right" data-aos-duration="1000">
          <span class="badge bg-primary-subtle text-primary mb-3 px-3 py-2 rounded-pill fs-6">ยินดีต้อนรับสู่พอร์ตโฟลิโอ</span>
          <h1 class="display-4 fw-bold mb-3">
            สวัสดีครับ ผม <span class="text-primary">สมชาย ใจดี</span>
          </h1>
          <h2 class="h4 text-secondary mb-4">Frontend Developer & Automation Enthusiast</h2>
          <p class="lead text-muted mb-4">
            มุ่งมั่นพัฒนาเว็บไซต์และระบบที่ตอบโจทย์การใช้งานจริง ด้วยเทคโนโลยีสมัยใหม่และการทำงานแบบอัตโนมัติ
          </p>
          <div class="d-flex gap-3">
            <a href="#projects" class="btn btn-primary btn-lg rounded-pill px-4">ดูผลงานของฉัน</a>
            <a href="#contact" class="btn btn-outline-secondary btn-lg rounded-pill px-4">ติดต่อเรา</a>
          </div>
        </div>
        <div class="col-lg-5 text-center" data-aos="fade-left" data-aos-duration="1000">
          <div class="hero-avatar-box">
            <!-- รูปโปรไฟล์ สามารถเปลี่ยน URL รูปภาพตรงนี้ได้ -->
            <img src="images/profile.png" alt="Profile" class="img-fluid profile-img">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= Scripts ================= -->
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- AOS Animation Library JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    // เปิดใช้งาน AOS Animation
    AOS.init({
      once: true, // แอนิเมชันทำงานครั้งเดียวตอนเลื่อนผ่าน
      offset: 100
    });
  </script>
</body>
</html>
